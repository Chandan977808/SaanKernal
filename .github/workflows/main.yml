name: Kernel Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

env:
  NAME: SaanKernal
  ANYKERNEL3_REPO: https://github.com/handingslider/AnyKernel3
  ANYKERNEL3_BRANCH: master

jobs:
  build:
    name: Build (${{ matrix.variant }}${{ matrix.perf && '-Perf' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [GKI, AOSP]
        perf: [false, true]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel"
          mkdir -p "$KERNEL_ROOT"

          cat >> "$GITHUB_ENV" << EOF
          DATE=$(date '+%Y%m%d_%H%M')
          KERNEL_ROOT=$KERNEL_ROOT
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          WILD_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          ZIP_NAME=${NAME}-${{ matrix.variant }}${{ matrix.perf && '-Perf' || '' }}
          EOF

          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

      - name: Setup Bazel Cache Dir
        uses: ./.github/actions/cache-bazel-setup

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Clone AnyKernel3
        run: |
          git clone "$ANYKERNEL3_REPO" -b "$ANYKERNEL3_BRANCH" "$ANYKERNEL3"
          rm -rf "$ANYKERNEL3/.git"
          sed -i "s/^kernel.string=.*/kernel.string=$NAME kernel/" "$ANYKERNEL3/anykernel.sh"

      - name: Clone Wild Patches
        run: git clone --depth=1 https://github.com/WildKernels/kernel_patches.git "$WILD_PATCHES"

      - name: Initialize and Sync Kernel Source
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android14-6.1-lts --repo-rev=v2.16 --depth=1
          if [[ "${{ matrix.variant }}" == "AOSP" ]]; then
            git clone https://github.com/mt6897-devs/kernel_manifest .repo/local_manifests
          fi
          repo --trace sync -c -j$(nproc --all) --fail-fast --no-tags --force-sync --no-clone-bundle

      - name: Set Kernel Source Directory
        run: |
          if [[ "${{ matrix.variant }}" == "AOSP" ]]; then
            echo "KERNEL_SOURCE=kernel-6.1" >> "$GITHUB_ENV"
          else
            echo "KERNEL_SOURCE=common" >> "$GITHUB_ENV"
          fi

      - name: Get Kernel Version
        id: get-version
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          VERSION=$(grep -E "^VERSION =" Makefile | head -n 1 | awk '{print $3}')
          PATCHLEVEL=$(grep -E "^PATCHLEVEL =" Makefile | head -n 1 | awk '{print $3}')
          SUBLEVEL=$(grep -E "^SUBLEVEL =" Makefile | head -n 1 | awk '{print $3}')
          echo "version=${VERSION}.${PATCHLEVEL}.${SUBLEVEL}" >> "$GITHUB_OUTPUT"

      - name: Restore Bazel Cache
        continue-on-error: true
        uses: ./.github/actions/cache-restore
        with:
          cache_path: /home/runner/.cache/bazel
          cache_key: duchamp-${{ steps.get-version.outputs.version }}
          cache_bucket: bazel-cache-duchamp-${{ matrix.variant }}${{ matrix.perf && '-perf' || '' }}
          restore_keys: |
            duchamp-

      - name: Add backported BBRv3
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          patch -p1 --no-backup-if-mismatch < "$WILD_PATCHES/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android14-6.1.patch" \
            || echo "::warning::BBRv3 patch failed"

      - name: Enable BBRv3 config
        uses: ./.github/actions/set-kernel-config
        with:
          kernel_dir: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
          config_list: |
            CONFIG_TCP_CONG_ADVANCED=y
            CONFIG_TCP_CONG_BBR3=y
            CONFIG_DEFAULT_BBR3=y
            CONFIG_TCP_CONG_BIC=y
            CONFIG_TCP_CONG_WESTWOOD=y
            CONFIG_TCP_CONG_HTCP=y
            CONFIG_TCP_CONG_CUBIC=y
            CONFIG_DEFAULT_TCP_CONG="bbr3"

      - name: Add NTSYNC Patches
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          for p in ntsync_compat_android14-6.1 ntsync_base; do
            patch -p1 --no-backup-if-mismatch < "$WILD_PATCHES/common/ntsync/$p.patch" \
              || echo "::warning::NTSYNC patch failed: $p"
          done

      - name: Enable NTSYNC
        uses: ./.github/actions/set-kernel-config
        with:
          kernel_dir: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
          config_list: |
            CONFIG_NTSYNC=y

      - name: Add DroidSpaces
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          curl -fsSL -o /tmp/droidspaces.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          patch -p1 --no-backup-if-mismatch < /tmp/droidspaces.patch \
            || echo "::warning::DroidSpaces patch failed"

      - name: Enable DroidSpaces config
        uses: ./.github/actions/set-kernel-config
        with:
          kernel_dir: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
          config_list: |
            CONFIG_PID_NS=y
            CONFIG_SYSVIPC=y
            CONFIG_POSIX_MQUEUE=y
            CONFIG_IPC_NS=y
            CONFIG_DEVTMPFS=y
            CONFIG_BINFMT_MISC=y
            CONFIG_BINFMT_SCRIPT=y
            CONFIG_BINFMT_ELF=y
            CONFIG_USER_NS=y

      - name: Add Wild performance patches
        if: matrix.perf == true
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          for p in disable_cache_hot_buddy mem_opt_prefetch optimise_memcmp \
             optimized_mem_operations file_struct_8bytes_align reduce_cache_pressure \
             f2fs_reduce_congestion f2fs_enlarge_min_fsync_blocks reduce_gc_thread_sleep_time \
             minimise_wakeup_time int_sqrt add_timeout_wakelocks_globally reduce_freeze_timeout \
             increase_ext4_default_commit_age increase_sk_mem_packets reduce_pci_pme_wakeups \
             silence_irq_cpu_logspam silence_system_logspam; do
            patch -p1 -F3 --no-backup-if-mismatch < "$WILD_PATCHES/common/${p}.patch" \
              || echo "::warning::perf patch failed: $p"
          done

          sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' \
            "$WILD_PATCHES/common/clear_page_16bytes_align.patch" \
            | patch -p1 -F3 --no-backup-if-mismatch \
            || echo "::warning::perf patch failed: clear_page_16bytes_align"

          FILE="drivers/base/power/wakeup.c"
          if grep -q "^void pm_system_wakeup(void)" "$FILE"; then
            if sed -n '/^void pm_system_wakeup(void)/,/^}/p' "$FILE" | grep -q 'suspend_abort_fs_sync();'; then
              sed -i '/^void pm_system_wakeup(void)/,/^}/{/suspend_abort_fs_sync();/d}' "$FILE"
            fi
          fi
          patch -p1 -F3 --no-backup-if-mismatch < "$WILD_PATCHES/common/avoid_extra_s2idle_wake_attempts.patch" \
            || echo "::warning::perf patch failed: avoid_extra_s2idle_wake_attempts"

      - name: Configuration
        uses: ./.github/actions/set-kernel-config
        with:
          kernel_dir: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
          config_list: |
            CONFIG_WERROR=n
            CONFIG_LOCALVERSION="-SaanKernal"

      - name: Cleanup protected exports
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          rm -rf ./android/abi_gki_protected_exports_*
          perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' ./BUILD.bazel
          sed -i 's/check_defconfig//' ./build.config.gki

      - name: Verify features applied
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          fail=0
          check() { grep -q -- "$2" "$3" || { echo "::error::$1 missing ($2 not in $3)"; fail=1; }; }
          check "BBRv3 patch"   'config TCP_CONG_BBR3' net/ipv4/Kconfig
          check "NTSYNC patch"  'config NTSYNC' drivers/misc/Kconfig
          check "BBRv3 default" '^CONFIG_DEFAULT_TCP_CONG="bbr3"$' arch/arm64/configs/gki_defconfig
          check "Localversion"  '^CONFIG_LOCALVERSION="-SaanKernal"$' arch/arm64/configs/gki_defconfig
          check "NTSYNC config" '^CONFIG_NTSYNC=y$' arch/arm64/configs/gki_defconfig
          check "PID_NS config" '^CONFIG_PID_NS=y$' arch/arm64/configs/gki_defconfig
          exit $fail

      - name: Commit Changes
        working-directory: ${{ env.KERNEL_ROOT }}/${{ env.KERNEL_SOURCE }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply $NAME changes" || true

      - name: Build Kernel with Bazel (LTO disabled)
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          tools/bazel build --config=fast --config=stamp --lto=none \
            --disk_cache=/home/runner/.cache/bazel \
            //${{ env.KERNEL_SOURCE }}:kernel_aarch64_dist

      - name: Copy image to AnyKernel3
        run: |
          cp "$KERNEL_ROOT/bazel-out/k8-fastbuild/bin/${KERNEL_SOURCE}/kernel_aarch64/Image" "$ANYKERNEL3/Image"

      - name: Save Bazel Cache
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cache-save
        with:
          cache_path: /home/runner/.cache/bazel
          cache_key: duchamp-${{ steps.get-version.outputs.version }}
          cache_bucket: bazel-cache-duchamp-${{ matrix.variant }}${{ matrix.perf && '-perf' || '' }}
          compression_level: 9
          github_token: ${{ github.token }}

      - name: Package AnyKernel3
        run: |
          cd "$ANYKERNEL3"
          zip -r9 "../${ZIP_NAME}-${DATE}.zip" *

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}-${{ env.DATE }}
          path: ./${{ env.ZIP_NAME }}-${{ env.DATE }}.zip
