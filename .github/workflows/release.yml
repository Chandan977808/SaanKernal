name: Release Build

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/main.yml
    permissions:
      contents: write

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Generate Changelog
        run: |
          {
            echo 'CHANGELOG<<CHANGELOG_EOF'
            git log -10 --no-merges --pretty=format:'- %s (%h)'
            echo ''
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release
        run: |
          set -euo pipefail

          mkdir -p release_files
          find artifacts -type f -name '*.zip' -exec cp {} release_files/ \;

          ZIP="$(find release_files -maxdepth 1 -type f -name 'SaanKernal-GKI-*.zip' | head -n 1)"
          [ -f "$ZIP" ] || { echo "Missing release ZIP" >&2; exit 1; }

          IMAGE="$(unzip -Z1 "$ZIP" | grep -E '(^|/)Image$' | head -n 1)"
          [ -n "$IMAGE" ] || { echo "Image not found in $ZIP" >&2; exit 1; }

          VERSION="$(unzip -p "$ZIP" "$IMAGE" | strings \
            | grep -oE 'Linux version [0-9]+\.[0-9]+\.[0-9]+' | head -n 1 \
            | sed 's/Linux version //')"
          [ -n "$VERSION" ] || { echo "Could not detect kernel version" >&2; exit 1; }

          {
            echo "RELEASE_DATE=$(date -u +'%Y.%m.%d')"
            echo "KERNEL_VERSION=$VERSION"
          } >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          tag_name: build-${{ github.run_id }}
          name: SaanKernal ${{ env.RELEASE_DATE }}
          body: |
            ## SaanKernal — ${{ env.RELEASE_DATE }}

            GKI kernel for **duchamp** (POCO X6 Pro) with BakaSU root.

            | Item | Value |
            | --- | --- |
            | Kernel | Linux ${{ env.KERNEL_VERSION }} |

            ### Root Manager

            - [BakaSU](https://github.com/Baka-SU/BakaSU/releases/latest)

            ### Recent Changes

            ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
